[tool.poetry]
name = "os2mo-amqp-trigger-job-function-configurator"
version = "0.0.0"  # versioning handled by conventional commits
description = "OS2mo integration for configuring job functions, allowing to edit the visibility settings of said functions as wished"
authors = ["Magenta ApS <info@magenta.dk>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastramqpi = "^14"
structlog = "^25"
fastapi = "^0.115"
uvicorn = "^0.34"
pydantic = "^1"
more-itertools = "^10"
websockets = "^13" # for ariadne
httpx = "^0.27" # for ariadne

[tool.poetry.group.test.dependencies]
pytest = "^8.4"
pytest-asyncio = "^1.4"
pytest-cov = "^5"
pytest-split = "^0.9"

[tool.poetry.group.dev.dependencies]
ariadne-codegen = "^0.7.1"
tomli = "^2.0.1"

[tool.poetry.group.pre-commit.dependencies]
pre-commit = "^3.6.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ariadne-codegen]
target_package_name = "autogenerated_graphql_client"
target_package_path = "job_function_configurator/"
client_name = "GraphQLClient"
schema_path = "schema.graphql"  # Found by running "curl -O http://localhost:5000/graphql/v21/schema.graphql"
queries_path = "queries.graphql"
plugins = [
    "ariadne_codegen.contrib.shorter_results.ShorterResultsPlugin",
]
[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"
[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
