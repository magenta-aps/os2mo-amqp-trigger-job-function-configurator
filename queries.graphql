# Every field of every validity period, so the tests can assert that the
# integration changes nothing but `extension_3` of the current period.
query _Testing_GetEngagementTimeline($engagement_uuid: UUID!) {
  engagements(
    filter: {uuids: [$engagement_uuid], from_date: null, to_date: null}
  ) {
    objects {
      objects {
        uuid
        user_key
        validity {
          from
          to
        }
        extension_1
        extension_2
        extension_3
        extension_4
        extension_5
        extension_6
        extension_7
        extension_8
        extension_9
        extension_10
        fraction
        is_primary
        primary {
          uuid
        }
        job_function {
          uuid
        }
        engagement_type {
          uuid
        }
        person {
          uuid
        }
        org_unit {
          uuid
        }
      }
    }
  }
}
