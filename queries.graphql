# Everything we need to decide the contents of extension_3, and everything we
# need to write the engagement back unchanged apart from that.
query GetEngagement($engagement_uuid: UUID!, $itsystem_user_key: String!) {
  engagements(filter: {uuids: [$engagement_uuid]}) {
    objects {
      current {
        validity {
          from
          to
        }

        user_key
        extension_1
        # Contains the AD job description
        extension_2
        # Contains the output of this integration
        extension_3
        extension_4
        extension_5
        extension_6
        extension_7
        extension_8
        extension_9
        extension_10

        is_primary
        primary {
          uuid
        }
        job_function {
          uuid
          name
          user_key
        }
        engagement_type {
          uuid
        }
        org_unit {
          uuid
        }
        person {
          uuid
          itusers(filter: {itsystem: {user_keys: [$itsystem_user_key]}}) {
            user_key
          }
        }
      }
    }
  }
}


mutation UpdateEngagement($input: EngagementUpdateInput!) {
  engagement_update(input: $input) {
    uuid
  }
}


